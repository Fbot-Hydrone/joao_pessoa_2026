# Fase 2 no drone real (phase2_real.launch.py). Frame: A PARTIR DA BASE DE
# DECOLAGEM, em metros, x para a direita e y para onde o nariz aponta ao armar
# (arena_yaw_deg 0, como o frame da Fase 1 no Orin).
#
# Nenhuma base aqui: sem posicao o drone faz a varredura da Fase 1 antes dos
# kits. Para dar uma base, use o argumento (pickup_1..3, delivery_1..3) ou
# escreva a lista abaixo. A organizacao pode dar posicoes noutro frame: ai
# ponha em `takeoff` onde fica a base de decolagem nesse frame e passe o
# arena_yaw_deg certo.
takeoff: [0.0, 0.0]

grid:
  step_m: 0.5
  origin_m: [0.0, 0.0]
  centre: node

# pickup:            # [x, y] ou [x, y, z_topo]
#   - [2.0, 0.5]
# delivery:
#   - [3.5, 6.0]
