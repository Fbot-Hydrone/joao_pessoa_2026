# FAST-LIO on the REAL Mid-360 (livox_ros_driver2, xfer_format 1 = CustomMsg).
# fast_lio_mid360_sim.yaml with the one thing the mimic does not have: the
# Mid-360's own IMU sits off the lidar origin (upstream mid360.yaml values).
# Not flown yet on the Raspberry Pi 5: check CPU load before a flight.
/**:
    ros__parameters:
        feature_extract_enable: false
        # every 3rd point: ~6.7k pts per scan into the filter, Jetson Nano budget
        point_filter_num: 3
        max_iteration: 3
        # coarser than upstream (0.5): the Nano target, and the arena is small
        filter_size_surf: 0.4
        filter_size_map: 0.4
        cube_side_length: 200.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1
            scan_line:  4
            # the Kopis is <= 330 mm across, so its own props sit inside ~0.25 m
            blind: 0.25
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     70.0
            # Mid-360 internal IMU -> lidar origin (Livox datasheet, upstream config)
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false
            scan_publish_en:  true
            # full registered scans: hydrone_lio's map node wants every point
            dense_publish_en: true
            scan_bodyframe_pub_en: false

        pcd_save:
            # the map node saves its own, deduplicated
            pcd_save_en: false
            interval: -1
