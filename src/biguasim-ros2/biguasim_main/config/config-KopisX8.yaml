/**:
  ros_parameters:
    biguasim_scenario:
      package_name: Competition
      world: CompetionMap
      # Must match an agent_name below — biguasim matches this against
      # '<agent_name>-id0' to flag the main agent (environments.py). It read
      # 'auv0' while the agent is 'uav0', so no agent was ever the main one.
      main_agent: uav0
      ticks_per_sec: 200
      frames_per_sec: 60
      octree_min: 0.1
      octree_max: 5
      draw_arrow: true
      show_viewport: true
      agents:
        - agent_name: uav0
          agent_type: KopisX8
          publish_commands: false
          sensors:
            - sensor_type: DynamicsSensor
              ros_publish: true
              configuration:
                UseCOM: true
                UseRPY: false
            - sensor_type: LocationSensor
              ros_publish: true
            - sensor_type: RotationSensor
              ros_publish: true
            - sensor_type: VelocitySensor
              ros_publish: true
            - sensor_type: DepthCamera
              ros_publish: true
              Hz: 100
              location: [0, 0, 0.5]
              configuration: {CaptureWidth: 182, CaptureHeight: 182, FOV: 60}
          dynamics:
            batch_size : 1
          control_abstraction : 'accel'
          location: [3, 3.4, 0.78]
          # location: [3, -9.4, 0.22]
          rotation: [0, 0, -90]
