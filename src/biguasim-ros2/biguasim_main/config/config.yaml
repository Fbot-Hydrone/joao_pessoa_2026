/**:
  ros_parameters:
    biguasim_scenario:
      package_name: Competition
      world: CompetionMap
      main_agent: auv0     
      ticks_per_sec: 90
      frames_per_sec: 60
      octree_min: 0.1
      octree_max: 5
      draw_arrow: true
      show_viewport: true
      agents:
        - agent_name: uav0
          agent_type: HolybroX500
          publish_commands: false
          sensors:
            - sensor_type: DynamicsSensor
              ros_publish: true
              configuration:
                UseCOM: true
                UseRPY: false
            - sensor_type: LocationSensor
              ros_publish: true
            - sensor_type: RotationSensor
              ros_publish: true
            - sensor_type: VelocitySensor
              ros_publish: true
            # Cameras throttled via Hz (must divide ticks_per_sec). Rendering them
            # caps the UE5 loop ~60 Hz regardless, so ticks_per_sec is kept at 90
            # (~0.67x real-time) here. For crisp 1.0x flight, drop the cameras and
            # raise ticks_per_sec to ~200 (+ SCHED_LOOP_RATE 100).
            - sensor_type: RGBCamera
              ros_publish: true
              Hz: 10
              configuration:
                Width: 320
                Height: 240
            - sensor_type: DepthCamera
              ros_publish: true
              Hz: 10
              configuration:
                Width: 320
                Height: 240
          dynamics:
            batch_size : 1
          control_abstraction : 'accel'
          location: [0, 0, 0.3]
          rotation: [0, 0, 0]