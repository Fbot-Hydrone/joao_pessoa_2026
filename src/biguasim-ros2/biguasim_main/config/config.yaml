/**:
  ros_parameters:
    biguasim_scenario:
      package_name: Competition
      world: CompetionMap
      main_agent: auv0     
      ticks_per_sec: 200
      frames_per_sec: 60
      octree_min: 0.1
      octree_max: 5
      draw_arrow: true
      show_viewport: true
      agents:
        - agent_name: uav0
          agent_type: HolybroX500
          publish_commands: false
          sensors:
            - sensor_type: DynamicsSensor
              ros_publish: true
              configuration:
                UseCOM: true
                UseRPY: false
            - sensor_type: LocationSensor
              ros_publish: true
            - sensor_type: RotationSensor
              ros_publish: true
            - sensor_type: VelocitySensor
              ros_publish: true
            # Cameras throttled via Hz (must divide ticks_per_sec). With the
            # array.array encode fix the loop sustains ~82 Hz with both 640x480
            # cameras, so ticks_per_sec=90 runs ~0.92x real-time (lower the camera
            # Hz or resolution for more headroom). Dropping the cameras lets the
            # loop reach ~260 Hz (raise ticks_per_sec + SCHED_LOOP_RATE for crisper
            # attitude control).
            # Resolution key is CaptureWidth/CaptureHeight — plain Width/Height is
            # silently ignored by the BiguaSim sensor (defaults to 256x256). FOV
            # feeds the CameraInfo intrinsics; RGBCamera/DepthCamera render at UE's
            # default 90 deg (they don't support FovAngle), so 90 keeps fx/fy
            # correct. Matching the real ZED 2's 110 deg needs a FovAngle-capable
            # sensor (RGBDCamera/CameraSensor) — a separate change.
            # Cameras ON. Rendering caps the loop at ~82 Hz, but with synthetic
            # clock the attitude loop runs in sim-time, so keeping ticks_per_sec=200
            # + SCHED_LOOP_RATE=100 keeps flight STABLE — the cost is the sim runs
            # slow-motion wall-clock while the cameras are on (more so at higher Hz).
            # Hz must divide ticks_per_sec (200/20=10). For real-time flight w/o vision,
            # comment these out and the loop reaches ~260 Hz (real-time at ticks 200).
            - sensor_type: RGBCamera
              ros_publish: true
              Hz: 20
              location: [0.14, 0, -0.08]              
              configuration: {CaptureWidth: 640, CaptureHeight: 480}
            - sensor_type: DepthCamera
              ros_publish: true
              Hz: 20
              location: [0.14, 0, -0.08
              ]         
              configuration: {CaptureWidth: 640, CaptureHeight: 480, FOV: 90}
            # Down-facing rangefinder (nadir altimeter) — Phase 1&2 sensor config.
            # Holodeck's RangeFinderSensor is a LaserScan scanner; LaserCount:1 +
            # LaserAngle:-90 aims the single beam straight down. Published as
            # LaserScan on /biguasim/<agent>/RangeFinderSensor; rangefinder_bridge
            # converts it to a MAVLink DISTANCE_SENSOR for ArduPilot (landing/flare
            # Z ref, NOT EKF height).
            - sensor_type: RangeFinderSensor
              ros_publish: true
              Hz: 20
              configuration:
                LaserCount: 1
                LaserAngle: -90        # feixe reto pra baixo
                LaserMaxDistance: 40
          dynamics:
            batch_size : 1
          control_abstraction : 'accel'
          location: [0, 0, 0.3]
          rotation: [0, 0, 0]

          # 